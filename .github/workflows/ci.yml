name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests - ${{ matrix.os }} - Julia ${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        julia-version: ['1']
        include:
          - os: ubuntu-latest
            julia-version: '1.11'

    steps:
      - uses: actions/checkout@v4
      - name: Ensure cache directory exists
        run: mkdir -p .retestitems
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Cache ReTestItems
        uses: actions/cache@v4
        with:
          path: .retestitems
          key: ${{ runner.os }}-retestitems-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-retestitems-
      
      # Unit + Integration in a single run so compilation is paid only once per OS.
      - name: Run Tests (Unit, Integration)
        env:
          JULIA_PKG_SERVER: ""
          ACCORD_TEST_WORKERS: ${{ matrix.os == 'windows-latest' && '0' || '6' }}
          # Tests run multithreaded (workers get "4,1"; in-process runs use this)
          JULIA_NUM_THREADS: "4,1"
        run: julia --project -e 'using Pkg; Pkg.test(test_args=["default"])'
      
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest'
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-lcov-${{ matrix.os }}-${{ matrix.julia-version }}
          path: lcov.info

  dave:
    # Builds libdave (Discord's DAVE implementation) from source and runs the
    # DAVE tests against it. Accord loads it through ACCORD_LIBDAVE.
    name: DAVE (libdave)
    runs-on: ubuntu-latest
    env:
      LIBDAVE_REF: main
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libdave
        run: |
          git clone --depth 1 --branch "$LIBDAVE_REF" https://github.com/discord/libdave.git "$RUNNER_TEMP/libdave"
          cd "$RUNNER_TEMP/libdave"
          echo "LIBDAVE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git submodule update --init --depth 1 cpp/vcpkg
      - name: Cache libdave build
        id: libdave-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libdave-dist
          key: libdave-${{ runner.os }}-${{ env.LIBDAVE_SHA }}
      - name: Build libdave (shared)
        if: steps.libdave-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP/libdave/cpp"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          make shared
          mkdir -p "$RUNNER_TEMP/libdave-dist"
          find build -name 'libdave.so*' -exec cp -a {} "$RUNNER_TEMP/libdave-dist/" \;
          ls -la "$RUNNER_TEMP/libdave-dist"
      - name: Locate library
        run: |
          lib=$(ls "$RUNNER_TEMP"/libdave-dist/*.so* | head -1)
          test -n "$lib"
          echo "ACCORD_LIBDAVE=$lib" >> "$GITHUB_ENV"
          nm -D --defined-only "$lib" | grep -c ' dave' || true
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Run DAVE tests
        env:
          JULIA_PKG_SERVER: ""
          ACCORD_REQUIRE_LIBDAVE: "1"
          ACCORD_TEST_WORKERS: "0"
          JULIA_NUM_THREADS: "4,1"
        run: julia --project -e 'using Pkg; Pkg.test(test_args=["dave"])'

  cli:
    name: AccordCLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Test AccordCLI
        env:
          JULIA_PKG_SERVER: ""
        run: julia --project=AccordCLI -e 'using Pkg; Pkg.test()'

  jet:
    name: Code Quality (Aqua + JET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure cache directory exists
        run: mkdir -p .retestitems
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Cache ReTestItems
        uses: actions/cache@v4
        with:
          path: .retestitems
          key: ${{ runner.os }}-retestitems-jet-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
      - name: Run Aqua + JET analysis
        env:
          JULIA_PKG_SERVER: ""
        run: julia --project -e 'using Pkg; Pkg.test(test_args=["quality"])'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
